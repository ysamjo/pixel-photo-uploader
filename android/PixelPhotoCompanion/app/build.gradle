plugins {
    id 'com.android.application'
}

android {
    namespace 'de.pixelphotouploader.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'de.pixelphotouploader.companion'
        minSdk 26
        targetSdk 28
        versionCode 12
        versionName '1.2.7'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // Dediziertes Android-10-Geraet, nur Sideload: klassische Dateiberechtigung ist Absicht.
        // Die Google-Play-Veroeffentlichungsregel gilt fuer diese App nicht.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
