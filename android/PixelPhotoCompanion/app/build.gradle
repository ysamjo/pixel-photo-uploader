plugins {
    id 'com.android.application'
}

android {
    namespace 'de.pixelphotouploader.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'de.pixelphotouploader.companion'
        minSdk 26
        targetSdk 28
        versionCode 9
        versionName '1.2.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
