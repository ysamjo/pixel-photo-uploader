name: pixel-photo-uploader

services:
  server:
    image: pixel-photo-uploader:3.3.17
    restart: unless-stopped
    command: ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - target: 8000
        published: "8088"
        protocol: tcp
    environment:
      PPU_STATE_DIR: /data/state
    volumes:
      # Archiv: hierher wird nur sortiert, daraus wird nur kopiert.
      - /DATA/Media/Photos/Archiv:/data/archive
      # Ein-Ordner-Prinzip: genau dieser Ordner wird per Resilio mit dem Pixel geteilt.
      - /DATA/AppData/resilio-sync/data/pixelsync:/data/pixelsync
      - /DATA/AppData/resilio-sync/data/pixelsync/staging:/data/staging
      - /DATA/AppData/resilio-sync/data/pixelsync/control:/data/control
      - /DATA/AppData/pixel-photo-uploader/state:/data/state
      # Cloud-Eingaenge (Dropbox + OneDrive) und lokaler Eingang:
      - /media/dropbox_2291ae2a1687/Kamera-Uploads:/data/dropbox
      - /media/onedrive_d34754613dec/Bilder/Eigene Aufnahmen:/data/onedrive
      - /DATA/Media/Photos/_eingang-inbox:/data/inbox
      # Optional: ein Foto-Bestand UNTER /data/archive wird vom rekursiven Walk
      # von selbst gefunden. :ro sichern den Bestand gegen "rm -rf" im Archiv.
      # Danach einen Vollabgleich in der Web-UI einreihen, sonst bleibt er unsichtbar.
      # - /media/Data_1/Pictures:/data/archive/Altbestand:ro

  watcher:
    image: pixel-photo-uploader:3.3.17
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "watch", "--poll-seconds", "60"]
    environment:
      PPU_STATE_DIR: /data/state
    volumes:
      - /DATA/Media/Photos/Archiv:/data/archive
      - /DATA/AppData/resilio-sync/data/pixelsync:/data/pixelsync
      - /DATA/AppData/resilio-sync/data/pixelsync/staging:/data/staging
      - /DATA/AppData/resilio-sync/data/pixelsync/control:/data/control
      - /DATA/AppData/pixel-photo-uploader/state:/data/state
      - /media/dropbox_2291ae2a1687/Kamera-Uploads:/data/dropbox
      - /media/onedrive_d34754613dec/Bilder/Eigene Aufnahmen:/data/onedrive
      - /DATA/Media/Photos/_eingang-inbox:/data/inbox
      # Beide Dienste brauchen denselben Bestand.
      # - /media/Data_1/Pictures:/data/archive/Altbestand:ro

x-casaos:
  id: io.github.ysamjo.pixel-photo-uploader
  main: server
  index: /
  port_map: "8088"
  scheme: http
  icon: https://raw.githubusercontent.com/ysamjo/pixel-photo-uploader/main/zimaos/Apps/PixelPhotoUploader/icon.svg
  title:
    en_US: Pixel Photo Uploader
    de_DE: Pixel Photo Uploader
  tagline:
    en_US: Sort photo archive and hand batches to a Pixel phone for Google Photos upload
    de_DE: Foto-Archiv sortieren und per Pixel-App nach Google Fotos übergeben
  description:
    en_US: Port of the Windows workflow for ZimaOS (companion app + Resilio, no ADB, no USB cable). Sorts Dropbox/inbox shots into the archive (YYYY.MM), stages pickup batches in the Resilio share and settles the Android app receipts before freeing phone storage. Setup, counters and "sync now" live in the web UI, no SSH needed.
    de_DE: Port des Windows-Workflows für ZimaOS (Companion-App + Resilio, kein ADB, kein USB-Kabel). Sortiert Dropbox-/Inbox-Aufnahmen ins Archiv (JJJJ.MM), legt Abhol-Batches in der Resilio-Freigabe ab und rechnet die Rückbelege der Android-App ab, bevor auf dem Telefon Platz gemacht wird. Einrichtung, Zähler und „Jetzt synchronisieren" liegen im Web-UI, kein SSH nötig.
  author: family
  developer: family
  category: Media
  architectures:
    - amd64
    - arm64
  version: "3.3.17"
  update_at: "2026-10-07"
  release_notes:
    en_US: ZimaOS packaging; cross-filesystem import fix; linear dedup and receipt speedups; a phone that refuses to free a file now settles it as already secured, and a new batch stages while an earlier handover is still open; receipts are read before a missing handover copy is restocked, so a phone free-up is no longer undone by the server.
    de_DE: ZimaOS-Paketierung; Import-Fix für Cloud-Mounts; schnellere Duplikatprüfung und Rückbeleg-Abrechnung; eine Absage des Telefons gilt als bereits gesichert statt als Blockade, ein neuer Batch läuft, solange eine Handreichung noch offen ist, und ein fehlendes Handreichungs-Exemplar wird erst nach dem Rückbeleg aus dem Archiv nachgelegt.
  website: https://github.com/ysamjo/pixel-photo-uploader
  repo: https://github.com/ysamjo/pixel-photo-uploader
  support: https://github.com/ysamjo/pixel-photo-uploader/issues
