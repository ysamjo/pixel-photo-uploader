services:
  server:
    # Built by .github/workflows/publish.yml from tag v3.3.14 (multi-arch
    # index linux/amd64 + linux/arm64, which the App Store requires).
    # After the tag build, re-pin the digest:
    #   docker buildx imagetools inspect ghcr.io/ysamjo/pixel-photo-uploader:3.3.14
    # and append @sha256:<digest> to the image below.
    image: ghcr.io/ysamjo/pixel-photo-uploader:3.3.14
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    restart: on-failure
    command: ["uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PPU_STATE_DIR: /data/state
    volumes:
      # The archive is only ever copied from; deletions happen inside the batch
      # folders below staging/, never below archive/.
      - "${APP_DATA_DIR}/data/archive:/data/archive"
      - "${APP_DATA_DIR}/data/pixelsync:/data/pixelsync"
      - "${APP_DATA_DIR}/data/pixelsync/staging:/data/staging"
      - "${APP_DATA_DIR}/data/pixelsync/control:/data/control"
      - "${APP_DATA_DIR}/data/state:/data/state"
      # Optional import sources (uncomment and set the paths in the web setup):
      # - "${APP_DATA_DIR}/data/dropbox:/data/dropbox"
      # - "${APP_DATA_DIR}/data/inbox:/data/inbox"

  watcher:
    image: ghcr.io/ysamjo/pixel-photo-uploader:3.3.14
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    restart: on-failure
    command: ["python", "-m", "app.cli", "watch", "--poll-seconds", "60"]
    environment:
      PPU_STATE_DIR: /data/state
    volumes:
      - "${APP_DATA_DIR}/data/archive:/data/archive"
      - "${APP_DATA_DIR}/data/pixelsync:/data/pixelsync"
      - "${APP_DATA_DIR}/data/pixelsync/staging:/data/staging"
      - "${APP_DATA_DIR}/data/pixelsync/control:/data/control"
      - "${APP_DATA_DIR}/data/state:/data/state"

  app_proxy:
    environment:
      APP_HOST: pixel-photo-uploader_server_1
      APP_PORT: "8000"
