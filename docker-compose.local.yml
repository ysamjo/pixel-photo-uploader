# Lokale Entwicklung und Tests fuer pixel-photo-uploader (macOS, Linux, Windows).
#
#   docker compose -f docker-compose.local.yml up -d --build
#
# Die Daten landen im data/-Ordner neben diesem Projekt.
# Web-UI laeuft auf: http://localhost:8000

name: pixel-photo-uploader-local

services:
  server:
    build: .
    image: pixel-photo-uploader:3.3.31
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      PPU_STATE_DIR: /data/state
    volumes:
      - ./data/archive:/data/archive
      - ./data/staging:/data/staging
      - ./data/control:/data/control
      - ./data/state:/data/state
      - ./data/dropbox:/data/dropbox
      - ./data/onedrive:/data/onedrive
      - ./data/inbox:/data/inbox

  watcher:
    build: .
    image: pixel-photo-uploader:3.3.31
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "watch", "--poll-seconds", "60"]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.runner import is_heartbeat_fresh; raise SystemExit(0 if is_heartbeat_fresh(900) else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      PPU_STATE_DIR: /data/state
    volumes:
      - ./data/archive:/data/archive
      - ./data/staging:/data/staging
      - ./data/control:/data/control
      - ./data/state:/data/state
      - ./data/dropbox:/data/dropbox
      - ./data/onedrive:/data/onedrive
      - ./data/inbox:/data/inbox
